config_version = 13

[bar.default]
end = [ "tray", "brightness", "volume", "network", "battery", "control-center", "session" ]
font_family = "JetBrainsMono NF"
margin_ends = 3
widget_spacing = 15

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 718.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd.kinds]
lock_keys = false
media = false

[shell]
font_family = "JetBrainsMono NF"

    [shell.animation]
    speed = 2.0500000305473804

[theme]
builtin = "Gruvbox"
mode = "dark"
source = "builtin"

[wallpaper.default]
path = "/home/ize/Pictures/Wallpapers/gruv-abstract-maze.png"

[wallpaper.last]
path = "/home/ize/Pictures/Wallpapers/gruv-abstract-maze.png"

[wallpaper.monitors.eDP-1]
path = "/home/ize/Pictures/Wallpapers/gruv-abstract-maze.png"

[widget.clock]
format = "{:%I:%M %p}"

[widget.control-center]
glyph = "snowflake"

[widget.launcher]
enabled = false

[widget.wallpaper]
enabled = false