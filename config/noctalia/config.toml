config_version = 13

[bar.default]
end = [ "tray", "brightness", "volume", "network", "battery", "control-center", "session" ]
font_family = "JetBrainsMono NF"
margin_ends = 3
widget_spacing = 15

[notification]
filter_order = [ "filter" ]

    [notification.filter.filter]
    allow_permanent = false
    allowed_urgencies = [ "critical" ]
    bypass_dnd = false
    enabled = true
    match = "netbird"
    play_sound = false
    save_history = false
    show_toast = false

[osd.kinds]
lock_keys = false
media = false

[shell]
font_family = "JetBrainsMono NF"

    [shell.animation]
    speed = 4.0

[theme]
builtin = "Gruvbox"
mode = "dark"
source = "builtin"

[widget.clock]
format = "{:%I:%M %p}"

[widget.control-center]
glyph = "snowflake"

[widget.launcher]
enabled = false

[widget.wallpaper]
enabled = false
